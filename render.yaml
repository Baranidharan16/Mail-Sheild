# Render Blueprint: ONE public web service (frontend + API) + managed PostgreSQL.
# Render → New → Blueprint → this repo.  Public URL: https://mailshield-sih.onrender.com
services:
  - type: web
    name: mailshield-sih
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      # Database connection string:
      # For external PostgreSQL (e.g. Neon, Supabase): set DATABASE_URL in Render Dashboard.
      - key: DATABASE_URL
        sync: false
      # --- Rollback: Uncomment below if rolling back to a managed Render PostgreSQL database ---
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: mailshield-db
      #     property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://mailshield-sih.onrender.com
      - key: CORS_ORIGINS
        value: https://mailshield-sih.onrender.com
      - key: LOAD_ML_MODELS
        value: "false"
      - key: UPLOAD_STORAGE_DIR
        value: /tmp/evidence
      - key: GOOGLE_REDIRECT_URI
        value: https://mailshield-sih.onrender.com/auth/google/callback
      - key: FERNET_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GMAIL_MONITOR_ENABLED
        value: "true"
      - key: GMAIL_POLL_INTERVAL_SECONDS
        value: "60"
      - key: GMAIL_AUTO_QUARANTINE
        value: "false"
      - key: DATA_RETENTION_DAYS
        value: "90"
      # --- Isolated sandbox (separate service below; only artefacts are sent, HMAC-signed) ---
      - key: SANDBOX_URL
        value: https://mailshield-sandbox.onrender.com   # change if Render gives the service another hostname
      - key: SANDBOX_SHARED_SECRET
        fromService:
          type: web
          name: mailshield-sandbox
          envVarKey: SANDBOX_SHARED_SECRET
      - key: SANDBOX_TIMEOUT_SECONDS
        value: "90"
      - key: ADVANCED_PIPELINE_ENABLED
        value: "true"
      # --- Public home / privacy pages used for Google OAuth brand verification ---
      - key: APP_PUBLIC_NAME
        value: MailShield            # must equal the OAuth consent-screen "App name"
      - key: GOOGLE_SITE_VERIFICATION
        sync: false                  # Search Console "HTML tag" content value

  # Isolated static-analysis sandbox. Own container, own image, NO database, NO Gmail/Google/Gemini
  # secrets, NO disk. Suspicious attachments/URLs are analysed here, never on mailshield-sih.
  # (Render private services are not available on the free plan, so it is a web service whose
  #  only data endpoint rejects anything not HMAC-signed with the shared secret.)
  - type: web
    name: mailshield-sandbox
    runtime: docker
    dockerfilePath: ./sandbox/Dockerfile
    dockerContext: ./sandbox
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: SANDBOX_SHARED_SECRET
        generateValue: true
      - key: SANDBOX_JOB_MEMORY_MB
        value: "320"
      - key: SANDBOX_JOB_TIMEOUT_SECONDS
        value: "45"

